<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Audit{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#222}
 header{background:#1f2a44;color:#fff;padding:.6rem 1.2rem;display:flex;gap:1rem;align-items:center}
 header a{color:#fff;text-decoration:none} header .sp{flex:1}
 main{max-width:1000px;margin:1.2rem auto;padding:0 1rem}
 section,.card{background:#fff;border:1px solid #dde1e7;border-radius:8px;padding:1rem;margin-bottom:1rem}
 h1,h2,h3{margin:.2rem 0 .6rem} table{width:100%;border-collapse:collapse}
 td,th{text-align:left;padding:.35rem;border-bottom:1px solid #eee;vertical-align:top}
 input,select,textarea{padding:.4rem;border:1px solid #bbb;border-radius:4px;font:inherit}
 textarea{width:100%;box-sizing:border-box} button{padding:.4rem .8rem;border:0;border-radius:4px;background:#2f5bd8;color:#fff;cursor:pointer}
 button.alt{background:#777} button.bad{background:#b3261e} .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
 .tag{font-size:.75rem;padding:.1rem .4rem;border-radius:10px;background:#e8ecf5} .sev-blocking{background:#f8d7d4}
 .muted{color:#777;font-size:.85rem} .err{color:#b3261e}
 .tabs{display:flex;gap:0.5rem;border-bottom:1px solid #dde1e7;margin-bottom:1rem;margin-top:1rem;}
 .tab-btn{background:none;border:none;padding:0.6rem 1.2rem;cursor:pointer;font-size:1rem;color:#777;border-bottom:3px solid transparent;border-radius:0;transition:all 0.2s;}
 .tab-btn:hover{color:#222;background:#f0f2f5;}
 .tab-btn.active{color:#2f5bd8;border-bottom:3px solid #2f5bd8;font-weight:bold;}
 .tab-pane{display:none;}
 .tab-pane.active{display:block;}
</style>
</head>
<body>
<header>
 <a href="/"><strong>Audit</strong></a>
 {% if is_admin %}<a href="/admin/users">Felhasználók</a>{% endif %}
 <span class="sp"></span>
 {% if user %}<a href="/notifications">Értesítések{% if unread %} <span class="tag" style="background:#f2c14e;color:#222">{{ unread }}</span>{% endif %}</a>
 <span>{{ user.name }} ({{ user.role }})</span><a href="/logout">Kilépés</a>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<script>
 function openTab(event, tabId) {
   // Hide all tab panes
   const tabPanes = document.querySelectorAll('.tab-pane');
   tabPanes.forEach(pane => pane.classList.remove('active'));

   // Remove active class from all tab buttons
   const tabBtns = document.querySelectorAll('.tab-btn');
   tabBtns.forEach(btn => btn.classList.remove('active'));

   // Show the selected tab pane and mark button as active
   document.getElementById(tabId).classList.add('active');
   if(event && event.currentTarget) {
     event.currentTarget.classList.add('active');
   }

   // Optional: Save active tab to localStorage or URL hash
   if(history.pushState) {
       history.pushState(null, null, '#' + tabId);
   }
 }

 // Initialize tabs based on URL hash or default to first tab
 document.addEventListener("DOMContentLoaded", () => {
    const hash = window.location.hash.substring(1);
    const tabBtn = document.querySelector(`.tab-btn[data-target="${hash}"]`);
    if(hash && tabBtn && document.getElementById(hash)) {
        openTab({currentTarget: tabBtn}, hash);
    } else {
        const firstBtn = document.querySelector('.tab-btn');
        if(firstBtn) {
            openTab({currentTarget: firstBtn}, firstBtn.dataset.target);
        }
    }
 });
</script>
</body>
</html>
