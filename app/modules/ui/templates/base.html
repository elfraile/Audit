<!doctype html>

            "surface-container-highest": "#d9e2ff",

            "inverse-primary": "#b4c5ff",
            "surface-container-low": "#f2f3ff",
            "outline-variant": "#c3c6d5",
            "on-error": "#ffffff",
            "surface-container-high": "#e1e7ff",
            "on-background": "#0f1b34",

<style>
 .tab-pane { display: none; }
 .tab-pane.active { display: block; }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TOP APP BAR -->
<header class="bg-surface-container-lowest border-b border-outline-variant shadow-sm top-0 z-30 sticky w-full">
<div class="flex flex-wrap items-center justify-between px-4 lg:px-6 w-full min-h-[4rem] py-2 gap-y-3">
  <div class="flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
        <span class="material-symbols-outlined text-headline-sm" data-icon="fact_check">fact_check</span>
      </div>
      <a href="/" class="text-headline-sm font-headline-sm font-bold text-primary tracking-tight whitespace-nowrap">Audit Workspace</a>
    </div>
  </div>

  <div class="flex items-center gap-4 shrink-0 flex-nowrap">
    {% if is_admin %}
      <a class="px-3 py-1.5 rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors" href="/admin/users">Felhasználók</a>
    {% endif %}
    {% if user %}
      <div class="flex items-center pl-2 gap-2 border-l border-outline-variant shrink-0">
        <a class="p-2 text-on-surface-variant hover:bg-surface-container rounded-lg transition-colors relative" href="/notifications" title="Értesítések">
          <span class="material-symbols-outlined text-headline-sm" data-icon="notifications">notifications</span>
          {% if unread %}
            <span class="absolute top-1 right-1 w-4 h-4 bg-secondary text-on-secondary text-[10px] font-bold flex items-center justify-center rounded-full">{{ unread }}</span>
          {% endif %}
        </a>
      </div>
      <div class="flex items-center gap-2 pl-2 border-l border-outline-variant shrink-0">
        <div class="w-8 h-8 rounded-full bg-primary-fixed text-primary font-semibold flex items-center justify-center font-label-sm text-label-sm ring-1 ring-primary/20 shrink-0">{{ user.name[0] | upper }}</div>
        <div class="hidden sm:block text-left whitespace-nowrap">
          <p class="font-label-md text-label-md text-on-surface leading-tight font-medium">{{ user.name }}</p>
          <p class="font-body-sm text-[11px] text-outline leading-tight">{{ user.role }}</p>
        </div>
      </div>
      <a href="/logout" class="ml-2 px-3 py-1.5 rounded-lg text-error hover:bg-error-container font-label-md transition-colors">Kilépés</a>
    {% endif %}
  </div>
</div>
</header>
<main class="flex-1 overflow-y-auto px-4 lg:px-8 py-6 w-full mx-auto max-w-7xl">
{% block content %}{% endblock %}
</main>
<script>
 function openTab(event, tabId) {
   // Hide all tab panes
   const tabPanes = document.querySelectorAll('.tab-pane');
   tabPanes.forEach(pane => pane.classList.remove('active'));

   // Remove active class from all tab buttons
   const tabBtns = document.querySelectorAll('.tab-btn');
   tabBtns.forEach(btn => btn.classList.remove('active'));

   // Show the selected tab pane and mark button as active
   document.getElementById(tabId).classList.add('active');
   if(event && event.currentTarget) {
     event.currentTarget.classList.add('active');
   }

   // Optional: Save active tab to localStorage or URL hash
   if(history.pushState) {
       history.pushState(null, null, '#' + tabId);
   }
 }

 // Initialize tabs based on URL hash or default to first tab
 document.addEventListener("DOMContentLoaded", () => {
    const hash = window.location.hash.substring(1);
    const tabBtn = document.querySelector(`.tab-btn[data-target="${hash}"]`);
    if(hash && tabBtn && document.getElementById(hash)) {
        openTab({currentTarget: tabBtn}, hash);
    } else {
        const firstBtn = document.querySelector('.tab-btn');
        if(firstBtn) {
            openTab({currentTarget: firstBtn}, firstBtn.dataset.target);
        }
    }
 });
</script>
</body>
</html>
