{% extends "base.html" %}
{% block content %}
<section style="max-width:360px;margin:3rem auto">
 <h2>Belépés</h2>
 {% if error %}<p class="err">{{ error }}</p>{% endif %}
 <form method="post" action="/login">
  <p><input name="email" type="email" placeholder="E-mail" required style="width:100%"></p>
  <p><input name="password" type="password" placeholder="Jelszó" required style="width:100%"></p>
  <button>Belépés</button>
 </form>
</section>
{% endblock %}
